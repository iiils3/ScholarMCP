name: Deploy ScholarMCP Video Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloud/video-worker/**'
      - '.github/workflows/deploy-modal-video-worker.yml'

concurrency:
  group: scholarmcp-modal-video-worker
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Modal CLI
        run: python -m pip install --upgrade 'modal>=1.5,<2'

      - name: Verify Modal credentials exist
        shell: bash
        run: |
          test -n "$MODAL_TOKEN_ID" || (echo 'MODAL_TOKEN_ID is missing' && exit 1)
          test -n "$MODAL_TOKEN_SECRET" || (echo 'MODAL_TOKEN_SECRET is missing' && exit 1)

      - name: Deploy worker to Modal
        run: modal deploy cloud/video-worker/modal_app.py

      - name: Cloud smoke benchmark
        run: modal run cloud/video-worker/modal_app.py::benchmark
