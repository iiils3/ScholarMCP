name: ScholarMCP source migration
on:
  push:
    paths:
      - scripts/patch-scholar-day.mjs
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/patch-scholar-day.mjs
      - name: Commit migration if needed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "ScholarMCP Builder"
          git config user.email "actions@users.noreply.github.com"
          git add src
          git commit -m "refactor: apply ScholarMCP source migration"
          git push
