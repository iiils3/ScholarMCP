name: Build and deploy ScholarMCP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Product quality gate
        run: npm run qa

      - name: Scholar Core health
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -H 'Origin: https://iiils3.github.io' \
            -D /tmp/scholar-core-headers.txt \
            -o /tmp/scholar-core-body.txt \
            https://scholarmcp-core-75hnna.v2.appdeploy.ai/api/_healthcheck
          grep -qi '^access-control-allow-origin: https://iiils3.github.io' /tmp/scholar-core-headers.txt

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
